<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="description"
      content="매일 편하게 마시는 무가당 보리차 제품 상세페이지"
    />
    <title>담은 보리차 — 일반식품</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": "담은 보리차",
        "category": "일반식품 음료",
        "description": "볶은 보리를 우려낸 무가당 차",
        "offers": { "@type": "Offer", "price": "12000", "priceCurrency": "KRW" }
      }
    </script>
  </head>
  <body>
    <main>
      <section class="hero" id="hero">
        <h1>하루 한 잔으로 혈당 관리</h1>
        <p>구수하게 즐기는 무가당 보리차</p>
        <a class="cta-button" href="#product-info">제품 정보 보기</a>
      </section>
      <section class="features" id="features">
        <h2>매일 챙기는 건강 습관</h2>
        <p>면역력 개선</p>
      </section>
      <section class="testimonials" id="testimonials">
        <h2>구매 후기</h2>
        <blockquote>이 차를 마시고 몸이 훨씬 좋아졌어요.</blockquote>
      </section>
      <section id="product-info">
        <h2>제품 정보</h2>
        <p>식품 유형: 침출차(일반식품)</p>
        <p>원재료: 볶은 보리 100%</p>
        <p>섭취 방법: 따뜻한 물 또는 찬물에 우려 드세요.</p>
      </section>
    </main>
  </body>
</html>
