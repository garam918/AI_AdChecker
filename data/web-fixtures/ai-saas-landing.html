<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="description"
      content="팀의 반복 업무를 자동화하는 ContentFlow AI 데모 랜딩페이지"
    />
    <title>ContentFlow AI — 업무 자동화</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "ContentFlow AI",
        "applicationCategory": "BusinessApplication",
        "offers": { "@type": "Offer", "price": "0" }
      }
    </script>
  </head>
  <body>
    <nav class="site-nav">
      <a href="/">홈</a><a href="#features">기능</a><a href="#pricing">요금</a>
    </nav>
    <main>
      <section class="hero" id="hero">
        <h1>업무 시간을 70% 줄이는 국내 최고의 AI</h1>
        <p>반복 업무를 한곳에서 자동화하세요.</p>
        <a class="cta-button" href="#pricing">지금 무료로 시작하기</a>
      </section>
      <section class="stats" id="stats">
        <h2>검증된 업무 경험</h2>
        <p>10,000개 기업이 선택</p>
      </section>
      <section class="features" id="features">
        <h2>정확한 자동화</h2>
        <p>99.8% 정확도</p>
        <p>AI 자동 보고서와 협업 기능을 제공합니다.</p>
        <img src="/assets/report.png" alt="AI 자동 보고서 화면" />
      </section>
      <section class="pricing" id="pricing">
        <h2>간단한 요금제</h2>
        <p>완전 무료</p>
        <button type="button">무료 체험 시작</button>
      </section>
      <section class="testimonials" id="testimonials">
        <h2>고객 후기</h2>
        <blockquote>이 서비스를 쓰고 생산성이 2배가 됐습니다</blockquote>
      </section>
      <section class="faq" id="faq">
        <h2>자주 묻는 질문</h2>
        <p>언제든 팀 설정에서 요금제를 변경할 수 있습니다.</p>
      </section>
      <div hidden>국내 최고의 숨겨진 추적 문구</div>
      <img src="/tracking.gif" alt="tracking" width="1" height="1" />
    </main>
    <footer class="site-footer">홈 기능 요금 홈 기능 요금</footer>
